title: "세미나 모음"
description: "MD 파일만 slides/ 에 추가하면 자동으로 슬라이드가 생성됩니다."
theme: catppuccin

# remote_slides: GitHub URL만으로 다른 repo의 MD를 슬라이드로 빌드
# (모두 선택사항)
#
# remote_slides:
#   # 파일 1개
#   - url: https://github.com/keepittrill/sw-learning/blob/main/topics/notes.md
#     stem: html-notes          # 선택 (없으면 파일명 stem 자동 사용)
#     seminar_theme: ocean      # 선택
#     seminar_title: "HTML 기초" # 선택
#
#   # 디렉토리 전체 (GitHub Contents API 사용)
#   - dir: https://github.com/keepittrill/sw-learning/tree/main/topics
#     pattern: "*.md"           # 선택 (기본: "*.md", fnmatch 형식)
#     stem_prefix: "sw-"        # 선택 (stem 충돌 방지용 접두어)
#     seminar_theme: catppuccin # 선택 (디렉토리 내 모든 파일에 적용)
