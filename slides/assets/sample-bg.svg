<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29" />
      <stop offset="50%" style="stop-color:#302b63" />
      <stop offset="100%" style="stop-color:#24243e" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#grad)"/>
  <!-- 장식용 원들 -->
  <circle cx="200" cy="150" r="180" fill="rgba(124,58,237,.12)"/>
  <circle cx="1100" cy="600" r="220" fill="rgba(8,145,178,.10)"/>
  <circle cx="900" cy="100" r="130" fill="rgba(5,150,105,.08)"/>
  <circle cx="100" cy="600" r="100" fill="rgba(167,139,250,.07)"/>
  <!-- 그리드 패턴 -->
  <g stroke="rgba(255,255,255,.04)" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>
</svg>
