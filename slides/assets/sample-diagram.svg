<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="600" height="400" fill="url(#bg)" rx="12"/>

  <!-- 제목 -->
  <text x="300" y="48" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="22" font-weight="700" fill="#e0e7ff">시스템 아키텍처</text>

  <!-- 카드 1 -->
  <rect x="40" y="80" width="155" height="90" rx="10" fill="url(#card1)" opacity=".9"/>
  <text x="117" y="120" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="14" font-weight="700" fill="#fff">클라이언트</text>
  <text x="117" y="140" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#c4b5fd">Web / Mobile</text>

  <!-- 카드 2 -->
  <rect x="220" y="80" width="155" height="90" rx="10" fill="url(#card2)" opacity=".9"/>
  <text x="297" y="120" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="14" font-weight="700" fill="#fff">API Gateway</text>
  <text x="297" y="140" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#bae6fd">인증 / 라우팅</text>

  <!-- 카드 3 -->
  <rect x="400" y="80" width="155" height="90" rx="10" fill="url(#card3)" opacity=".9"/>
  <text x="477" y="120" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="14" font-weight="700" fill="#fff">서비스 레이어</text>
  <text x="477" y="140" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#a7f3d0">Microservices</text>

  <!-- 화살표 1 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <line x1="196" y1="125" x2="218" y2="125" stroke="#a78bfa" stroke-width="2"
        marker-end="url(#arrow)"/>
  <line x1="376" y1="125" x2="398" y2="125" stroke="#a78bfa" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- 하단 카드 두 개 -->
  <rect x="130" y="230" width="155" height="85" rx="10" fill="rgba(255,255,255,.08)"
        stroke="rgba(167,139,250,.4)" stroke-width="1.5"/>
  <text x="207" y="267" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#e0e7ff">데이터베이스</text>
  <text x="207" y="285" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#94a3b8">PostgreSQL</text>
  <text x="207" y="302" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#94a3b8">Redis</text>

  <rect x="315" y="230" width="155" height="85" rx="10" fill="rgba(255,255,255,.08)"
        stroke="rgba(167,139,250,.4)" stroke-width="1.5"/>
  <text x="392" y="267" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#e0e7ff">인프라</text>
  <text x="392" y="285" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#94a3b8">Kubernetes</text>
  <text x="392" y="302" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#94a3b8">GitHub Actions</text>

  <!-- 연결선 -->
  <line x1="297" y1="171" x2="207" y2="229" stroke="rgba(167,139,250,.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="297" y1="171" x2="392" y2="229" stroke="rgba(167,139,250,.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- 하단 레이블 -->
  <text x="300" y="378" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="rgba(255,255,255,.3)">auto-seminar 샘플 다이어그램</text>
</svg>
