name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          echo "Korean fonts installed: $(fc-list :lang=ko | head -3)"

      - name: Find Chrome executable
        run: |
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium-browser || which chromium || true)
          if [ -n "$CHROME" ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> $GITHUB_ENV
            echo "Found Chrome: $CHROME"
          else
            echo "Chrome not found – PDF/PNG export will be skipped"
          fi

      - name: Build slides
        run: python scripts/build.py
        env:
          REMOTE_SLIDES_TOKEN: ${{ secrets.REMOTE_SLIDES_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
